*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tekst);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input::placeholder{color:var(--svagere)}

/* top */
.top{position:sticky;top:0;z-index:10;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--flade);border-bottom:1px solid var(--linje)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;margin-right:6px}
.brand::before{content:"";width:26px;height:26px;background:var(--logo) center/contain no-repeat}
.tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px}
.tab{border:0;background:none;padding:5px 14px;border-radius:7px;color:var(--svag);font-weight:500}
.tab.aktiv{background:var(--flade);color:var(--tekst);box-shadow:var(--skygge),0 0 0 1px var(--linje)}
.tab:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
.muted{color:var(--svag)}.lille{font-size:12.5px}
.tilbage{border:0;background:none;padding:6px 10px 6px 4px;border-radius:8px;color:var(--svag);font-weight:500}
.tilbage:hover{background:var(--hover);color:var(--tekst)}

/* menu: Mere */
.mere{position:relative;display:flex}
.meremenu{position:absolute;right:0;top:calc(100% + 8px);min-width:190px;background:var(--flade);border:1px solid var(--linje);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;z-index:30;display:flex;flex-direction:column}
.meremenu button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;font-weight:500}
.meremenu button:hover{background:var(--hover)}.meremenu button.aktiv{background:var(--bg)}
.meremenu hr{border:0;border-top:1px solid var(--linje);margin:4px 2px;width:auto}
@media (max-width:700px){
  .top{padding:0 14px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;border-radius:0;background:var(--flade);border-top:1px solid var(--linje);padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:0;justify-content:space-around}
  .tabs .tab,.tabs .mere{flex:1}.tabs .mere .tab{width:100%}
  .tab{padding:9px 2px;font-size:12.5px;text-align:center;white-space:nowrap}
  .meremenu{top:auto;bottom:calc(100% + 8px);right:8px}
  body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .bar{bottom:calc(56px + env(safe-area-inset-bottom))}
  .beskeder{bottom:calc(68px + env(safe-area-inset-bottom))}
  body.bar-synlig .beskeder{bottom:calc(140px + env(safe-area-inset-bottom))}
}

/* knapper og felter */
.btn{border:1px solid var(--linje);background:var(--flade);color:var(--tekst);padding:7px 13px;border-radius:8px;font-weight:500}
a.btn{display:inline-block;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.primaer{background:var(--accent);border-color:var(--accent);color:var(--accent-tekst)}
.btn.primaer:hover{filter:brightness(1.06);background:var(--accent)}
.btn.stor{width:100%;padding:11px 16px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{border-color:transparent;background:none;color:var(--svag)}
.btn.ghost:hover{background:var(--hover);color:var(--tekst)}
.input{width:100%;padding:8px 11px;border:1px solid var(--linje);border-radius:9px;background:var(--flade)}
.input:focus,.felt:focus,.notefelt:focus{outline:2px solid var(--accent);outline-offset:-1px}
.etiket{display:block;font-size:11.5px;color:var(--svag);margin-bottom:4px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;color:var(--svag);font-size:13px;font-weight:500}
.seg button.aktiv{background:var(--flade);color:var(--tekst);box-shadow:var(--skygge),0 0 0 1px var(--linje)}
.overskrift{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--svagere);margin:0 0 6px 2px}
.tom{color:var(--svag);text-align:center;padding:48px 12px}

/* jobs (startside) */
.side{max-width:1228px;margin:0 auto;padding:28px 24px 60px}
.side:not(.bred)>*{max-width:760px}
.side h1{font-size:22px;margin:0 0 4px}
.jobliste{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.job{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border:1px solid var(--linje);background:var(--flade);padding:12px 16px;border-radius:12px}
.job:hover{border-color:var(--accent)}
.dato{flex:none;width:44px;text-align:center;line-height:1.1}
.dato b{display:block;font-size:20px}
.dato span{font-size:11px;color:var(--svag);text-transform:uppercase;letter-spacing:.04em}
.job .t{flex:1;min-width:0}
.job .t b{display:block;font-size:15px;font-weight:600}
.job .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12.5px;color:var(--svag);white-space:nowrap}
.prik{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--svagere);vertical-align:1px}
.prik.ok{background:var(--ok)}.prik.adv{background:var(--adv)}
.andre{margin-top:28px;display:flex;gap:10px;align-items:center}
.andre select{max-width:280px}

/* editor (fuld skærm) */
.jo-detalje{padding:4px 14px 16px 42px;border-top:1px solid var(--linje);background:var(--flade2)}
@media (max-width:700px){.jo-detalje{padding-left:14px}}
.fokus{display:grid;gap:14px;margin-top:20px;grid-template-columns:minmax(0,1fr)}.fokus>*{min-width:0}.resten summary{cursor:pointer;padding:6px 2px}
.bryd{display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:9px 12px;font-weight:600;margin-top:6px}
.bryd.adv{background:var(--adv-blid);color:var(--adv)}.bryd.fejl{background:var(--fejl-blid);color:var(--fejl)}
.dato-adv{margin-top:8px;border-radius:8px;padding:8px 11px;font-weight:600}.dato-adv.adv{background:var(--adv-blid);color:var(--adv)}.dato-adv.fejl{background:var(--fejl-blid);color:var(--fejl)}
.bryd .kun-tlf{display:none}
@media (max-width:700px){.bryd .navne{display:none}.bryd .kun-tlf{display:inline}}
.agr.markeret{outline:2px solid var(--adv);outline-offset:6px;border-radius:10px}
.vaelg.låst,.liste.låst .lkrop .step,.liste.låst .lkrop .ekstra,.liste.låst .lkrop .notefelt,.liste.låst .lhoved .felter,.liste.låst .lhoved .startfra,.liste.låst .anlaeg{pointer-events:none}
.vaelg.låst{opacity:.45}.liste.låst .lkrop .step,.liste.låst .lkrop .ekstra{opacity:.4}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,460px);height:calc(100vh - var(--top))}
.vaelg{overflow:auto;padding:0 28px 40px}
.soeg{position:sticky;top:0;z-index:2;background:var(--bg);padding:20px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

const PL_ORDEN = ["Lyd", "DJ-udstyr", "Lys", "Scene", "Stativer", "Kabler & strøm", "Transport", "Leje", "Andet", "Løse genstande"];
const PL_UGEDAGE = ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"];
function plDato(iso, medDag = true) {   // som dansk_dato: 2026-10-23 -> "fredag 23. oktober 2026", ellers det givne
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  if (!m) return iso || "";
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return (medDag ? PL_UGEDAGE[d.getUTCDay()] + " " : "") + `${d.getUTCDate()}. ${MDL[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}
const plTid = iso => plDato(iso, false) + (String(iso).length >= 16 ? " kl. " + String(iso).slice(11, 16).replace(":", ".") : "");   // dansk_tid
function pakkeRækker(linjer, lager) {   // som raekker() i pakkeliste_pdf.py: faste noter fra lageret, kategori og advarsler
  const L = new Map(lager.map(x => [(x.navn || "").trim().toLowerCase(), x])), adv = [], R = [];
  for (const l of linjer) {
    let n = (l.udstyr || "").trim(), k;
    const a = Math.trunc(Number(l.antal) || 0), noter = [l.note || ""];
    if (a <= 0) continue;
    if (n.toUpperCase().startsWith("LEJE:")) { k = "Leje"; n = n.slice(5).trim() + " (LEJE)"; }
    else {
      const x = L.get(n.toLowerCase());
      if (!x) { k = "Andet"; adv.push(`Findes ikke i lageret: ${n}`); }
      else {
        k = x.kategori || "Andet";
        noter.unshift(x.note || "");
        if ((x.status || "På lager") !== "På lager") adv.push(`${n}: status er ${x.status}`);
        if (x.antal != null && a > Math.trunc(Number(x.antal))) adv.push(`${n}: pakker ${a}, lageret har ${Math.trunc(Number(x.antal))}`);
      }
    }
    R.push([k, n, a, noter.filter(Boolean).join(". ")]);
  }
  const o = k => { const i = PL_ORDEN.indexOf(k); return i < 0 ? 99 : i; };
  return {R: R.sort((x, y) => o(x[0]) - o(y[0])), adv};
}
function huskFraSidst(job, dato) {   // som husk_fra_sidst i fabz_evaluering.py
  const PUNKTER = ["ramte", "toemte", "manglede", "husk", "spurgte"], n = (job || "").trim().toLowerCase();
  const hit = (D.evalueringer || []).filter(r => (r.job || "").trim().toLowerCase() === n && (!dato || r.dato < dato) && PUNKTER.some(k => Array.isArray(r[k]) ? r[k].length : r[k]));
  const r = hit.reduce((b, x) => !b || x.dato > b.dato ? x : b, null);
  return r ? [...(r.husk || [])] : [];
}

// Motoren: sider, skrift, linjeskift og "flowables" som reportlabs SimpleDocTemplate (frame med 6 pt padding). y måles oppefra
async function pdfMotor() {
  const L = await hentPdfLib();

      }

      },

// ---------- Kørsel foreslås under Sted (Oscar 12/11, skitse tilbud-koersel-auto): afstand fra lageret på Åhavevej ----------
// Samme regel som fabz-tilbud: over 50 km i fugleflugt giver kørsel, 4 kr. pr. km tur/retur ad vej. Adressen via Photon, vejen via OSRM, begge fra browseren
const LAGER_KOORD = {lat: 56.16282, lon: 9.55481}, KØRSEL_GRÆNSE = 50, KM_PRIS = 4;
const TBK = new Map();   // sted -> {status: "henter"|"ok"|"fejl", fugl, km}
const fugleflugt = (a, b) => { const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2; return 6371 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)); };
const medFrist = (ms) => { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };
async function tbGeokod(sted) {   // Photon først (forstår stednavne), Nominatim som reserve, når Photon hænger eller intet finder (12/11: Photon svarede ikke)
  try { const f = (await hentForslag(sted, medFrist(6000)))[0]; if (f) return f; } catch {}
  try {
    const r = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=dk&q=${encodeURIComponent(sted)}`, {signal: medFrist(8000)})).json();
    if (r[0]) return {lat: Number(r[0].lat), lon: Number(r[0].lon)};
  } catch {}
  return null;
}
async function tbKørselBeregn() {
  const sted = (TB?.sted || "").trim();
  if (!sted || TBK.has(sted)) return;
  TBK.set(sted, {status: "henter"}); tbKørselOpdater();
  let ud;
  const f = await tbGeokod(sted);
  if (!f) ud = {status: "fejl"};
  else {
    const fugl = Math.round(fugleflugt(LAGER_KOORD, f));
    ud = {status: "ok", fugl};
    if (fugl > KØRSEL_GRÆNSE) {
      try { const r = await (await fetch(`https://router.project-osrm.org/route/v1/driving/${LAGER_KOORD.lon},${LAGER_KOORD.lat};${f.lon},${f.lat}?overview=false`, {signal: medFrist(10000)})).json();
        ud.km = Math.round(2 * r.routes[0].distance / 1000); } catch { ud.vejFejl = true; }
    }
  }
  TBK.set(sted, ud); tbKørselOpdater();
}

// Morgenens mailoversigt starter også her (Oscar 13/11: "også firma mailen skal laves ved mødt ind"), ikke længere fast kl. 10.30. mailoversigt.py sender kun én om morgenen
async function startMorgenkørsler() {
  const midnat = new Date(); midnat.setHours(0, 0, 0, 0);
  const idag = iDag(), m = D.mailoversigt;
  if (!(m && m.dato === idag && ["sendt", "bestilt"].includes(m.status))) {
    try {
      tjek(await gh(`/repos/${REPO}/actions/workflows/mail.yml/dispatches`, {method: "POST", body: {ref: BRANCH, inputs: {eftermiddag: "false", igen: "false"}}}), "mail.yml");
      D.mailoversigt = {dato: idag, status: "bestilt", tid: nuHHMM()};   // Planlæg dag venter på den (mailTilPlan)
    } catch (e) { console.warn("Mødt ind: kunne ikke starte mailoversigten", e); }
  }
  for (const [wf, inputs] of [["dinero.yml", {}], ["kalender.yml", {opgaver: "true"}]]) {
    try {
      const r = tjek(await gh(`/repos/${REPO}/actions/workflows/${wf}/runs?created=${encodeURIComponent(">=" + midnat.toISOString())}&per_page=30&t=${Date.now()}`), wf);
      const kørt = (await r.json()).workflow_runs.some(x => x.status !== "completed" || x.conclusion === "success");
      if (!kørt) tjek(await gh(`/repos/${REPO}/actions/workflows/${wf}/dispatches`, {method: "POST", body: {ref: BRANCH, inputs}}), wf);
    } catch (e) { console.warn("Mødt ind: kunne ikke starte " + wf, e); }
  }
}

// Ny beregning, når månedsoversigten er ældre end sine kilder: samme vej som Mødt ind (kalender.yml regner maanedsoversigt --gem). Én gang pr. indlæsning
const OMR = {status: null};
async function startOmregning() {
  if (OMR.status || !moGammel()) return;
  OMR.status = "regner"; if (fane === "oekonomi") tegn();
  const t0 = Date.now(), runs = async () => (await tjek(await gh(`/repos/${REPO}/actions/workflows/kalender.yml/runs?per_page=10&t=${Date.now()}`), "kørselsstatus").json()).workflow_runs;
  try {
    let kører = (await runs()).find(x => x.status !== "completed");
    if (!kører) tjek(await gh(`/repos/${REPO}/actions/workflows/kalender.yml/dispatches`, {method: "POST", body: {ref: BRANCH, inputs: {opgaver: "false"}}}), "kalender-workflowet");
    while (Date.now() - t0 < 300000) {
      await sleep(8000);
      const rs = await runs(), r = kører ? rs.find(x => x.id === kører.id) : rs.find(x => Date.parse(x.created_at) >= t0 - 60000);
      if (r && r.status === "completed") break;
    }
    await hentData();
    OMR.status = moGammel() ? "fejl" : null;
  } catch (e) { console.warn("Ny beregning af månedsoversigten:", e); OMR.status = "fejl"; }
  tegn();
}

// ---------- hent alle jobs ----------
async function hentJobs() {
  henterJobs = true;
  tegn();
  const t0 = Date.now();
  try {
    tjek(await gh(`/repos/${REPO}/actions/workflows/kalender.yml/dispatches`, {method: "POST", body: {ref: BRANCH, inputs: {opgaver: "true"}}}), "kalender-workflowet");
    let run = null;
    while (Date.now() - t0 < 240000) {
      await sleep(4000);
      const rr = tjek(await gh(`/repos/${REPO}/actions/workflows/kalender.yml/runs?event=workflow_dispatch&per_page=5&t=${Date.now()}`), "kørselsstatus");
      run = (await rr.json()).workflow_runs.find(x => Date.parse(x.created_at) >= t0 - 60000);
      if (run && run.status === "completed") break;
      run = null;
    }
    if (!run) throw new Error("Hentningen blev ikke færdig inden 4 minutter. Tjek Actions i fabz-data.");
    if (run.conclusion !== "success") throw new Error("Hentningen fejlede (" + run.conclusion + "). Se " + run.html_url);
    await hentData();
  } catch (e) {
    alert(e.message);
  } finally {
    henterJobs = false;
    tegn();
  }
}

// ---------- token og start ----------
function skiftToken() {
  lager.del(TOKEN_KEY); cacheSlet();   // en ny token må ikke se den gamle kopi
  token = null;
  visOpsaet();
}
function visOpsaet(fejl) {
  $("top").replaceChildren(h("span", {class: "brand"}, "Fabz"));
  const felt = h("input", {class: "input", type: "password", placeholder: "github_pat_…", autocomplete: "off"});
  const gem = () => { const t = felt.value.trim(); if (!t) return; lager.set(TOKEN_KEY, t); token = t; start(); };
  felt.addEventListener("keydown", e => { if (e.key === "Enter") gem(); });
  $("rod").replaceChildren(h("div", {class: "opsaet"},
    h("h2", {}, "Indsæt din token"),
    h("p", {class: "muted"}, "Den ligger i 1Password (fine-grained, kun til ", REPO, ", Contents og Actions read/write). Den gemmes kun i denne browser."),
    fejl ? h("p", {class: "fejltekst"}, fejl) : null, felt,
    h("div", {style: "margin-top:12px"}, h("button", {class: "btn primaer", type: "button", onclick: gem}, "Gem og åbn"))));
}
async function start() {
  token = token || lager.get(TOKEN_KEY);
  if (!token) { visOpsaet(); return; }
  // gemte data fra sidst: tegn med det samme (Oscar 13/11), friske hentes bagefter
  let vist = false;
  $("rod").replaceChildren(h("div", {class: "tom"}, "Henter data …"));
  const c = await cacheHent();
  if (c?.D && c.repo === REPO && c.v === cacheV()) {
    const tom = D;
    try { D = c.D; CACHE_TID = c.tid; S = null; L = null; læsAdresse(); tegn(); vist = true; }
    catch { D = tom; CACHE_TID = null; }
  }
  for (let forsøg = 0; ; forsøg++) {   // tokenboksen kun ved afvist token; ellers ventes der og prøves igen, og tokenen bliver
    try { await hentData(); break; }
    catch (e) {
      if (e.token) { cacheSlet(); CACHE_TID = null; visOpsaet(e.message); return; }
      if (vist) besked({id: "mangler", klasse: "adv", titel: "GitHub svarer ikke lige nu, prøver igen …"});
      if (!vist) $("rod").replaceChildren(h("div", {class: "tom"}, "GitHub svarer ikke lige nu, prøver igen …", h("div", {class: "muted lille", style: "margin-top:6px"}, e.message)));
      await sleep(Math.min(30000, 3000 * (forsøg + 1)));
    }
  }
  FRISK = true; CACHE_TID = null; friskOk();
  if (vist) fjernBesked(beskeder.find(b => b.id === "mangler" && !MANGLER.length));
  S = null; L = null; læsAdresse();   // en pakkeliste eller Lager åbnet på de gemte data bygges igen på de friske (adressen husker, hvor man er)
  tegn();   // med de friske data
  cacheGem();
  startOmregning();
}
window.addEventListener("beforeunload", e => {
  if (sender > 0 || (L && (ændringer().length || L.ny.length))) { e.preventDefault(); e.returnValue = ""; }
});
start();
