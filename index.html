<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabz panel</title>
<style>
:root{
  --bg:#f4f5f7;--flade:#fff;--flade2:#f9fafb;--tekst:#16191f;--svag:#6b7280;--svagere:#9ca3af;
  --linje:#e7e9ee;--hover:#f1f3f6;--accent:#2563eb;--accent-blid:#eef4ff;--accent-tekst:#fff;
  --adv:#b45309;--adv-blid:#fff5e6;--fejl:#b91c1c;--fejl-blid:#fdeeee;--ok:#15803d;--ok-blid:#eaf7ef;
  --skygge:0 1px 2px rgba(16,24,40,.06);--top:56px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1116;--flade:#161a21;--flade2:#1b2029;--tekst:#e8ebf1;--svag:#9aa3b2;--svagere:#6b7484;
  --linje:#252b36;--hover:#1e242e;--accent:#6aa2ff;--accent-blid:#18263d;--accent-tekst:#0e1116;
  --adv:#f4b04a;--adv-blid:#2a2114;--fejl:#f87171;--fejl-blid:#2b1717;--ok:#4ade80;--ok-blid:#13281b;--skygge:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tekst);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input::placeholder{color:var(--svagere)}

/* top */
.top{position:sticky;top:0;z-index:10;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--flade);border-bottom:1px solid var(--linje)}
.brand{font-weight:700;letter-spacing:.02em;margin-right:6px}
.tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px}
.tab{border:0;background:none;padding:5px 14px;border-radius:7px;color:var(--svag);font-weight:500}
.tab.aktiv{background:var(--flade);color:var(--tekst);box-shadow:var(--skygge),0 0 0 1px var(--linje)}
.tab:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
.muted{color:var(--svag)}.lille{font-size:12.5px}
.tilbage{border:0;background:none;padding:6px 10px 6px 4px;border-radius:8px;color:var(--svag);font-weight:500}
.tilbage:hover{background:var(--hover);color:var(--tekst)}

/* knapper og felter */
.btn{border:1px solid var(--linje);background:var(--flade);padding:7px 13px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primaer{background:var(--accent);border-color:var(--accent);color:var(--accent-tekst)}
.btn.primaer:hover{filter:brightness(1.06);background:var(--accent)}
.btn.stor{width:100%;padding:11px 16px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{border-color:transparent;background:none;color:var(--svag)}
.btn.ghost:hover{background:var(--hover);color:var(--tekst)}
.input{width:100%;padding:8px 11px;border:1px solid var(--linje);border-radius:9px;background:var(--flade)}
.input:focus,.felt:focus,.notefelt:focus{outline:2px solid var(--accent);outline-offset:-1px}
.etiket{display:block;font-size:11.5px;color:var(--svag);margin-bottom:4px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;color:var(--svag);font-size:13px;font-weight:500}
.seg button.aktiv{background:var(--flade);color:var(--tekst);box-shadow:var(--skygge),0 0 0 1px var(--linje)}
.overskrift{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--svagere);margin:0 0 6px 2px}
.tom{color:var(--svag);text-align:center;padding:48px 12px}

/* jobs (startside) */
.side{max-width:760px;margin:0 auto;padding:28px 24px 60px}
.side h1{font-size:22px;margin:0 0 4px}
.jobliste{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.job{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border:1px solid var(--linje);background:var(--flade);padding:12px 16px;border-radius:12px}
.job:hover{border-color:var(--accent)}
.dato{flex:none;width:44px;text-align:center;line-height:1.1}
.dato b{display:block;font-size:20px}
.dato span{font-size:11px;color:var(--svag);text-transform:uppercase;letter-spacing:.04em}
.job .t{flex:1;min-width:0}
.job .t b{display:block;font-size:15px;font-weight:600}
.job .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12.5px;color:var(--svag);white-space:nowrap}
.prik{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--svagere);vertical-align:1px}
.prik.ok{background:var(--ok)}.prik.adv{background:var(--adv)}
.andre{margin-top:28px;display:flex;gap:10px;align-items:center}
.andre select{max-width:280px}

/* editor (fuld skærm) */
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,460px);height:calc(100vh - var(--top))}
.vaelg{overflow:auto;padding:0 28px 40px}
.soeg{position:sticky;top:0;z-index:2;background:var(--bg);padding:20px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--linje);background:var(--flade);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--svag)}
.chip:hover{color:var(--tekst)}
.chip.aktiv{background:var(--tekst);border-color:var(--tekst);color:var(--flade)}
.gruppe{margin-top:20px}
.kort{background:var(--flade);border:1px solid var(--linje);border-radius:12px;overflow:hidden}
.r{display:flex;align-items:center;gap:14px;padding:10px 14px;border-top:1px solid var(--linje)}
.r:first-child{border-top:0}
.r .n{flex:1;min-width:0;color:var(--svag)}
.r.paa .n{color:var(--tekst);font-weight:600}
.r.paa .step{border-color:var(--accent)}
.lagertal{color:var(--svagere);font-size:12.5px;white-space:nowrap}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--adv-blid);color:var(--adv);margin-left:8px;font-weight:500;white-space:nowrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--linje);border-radius:99px;background:var(--flade);height:32px;flex:none}
.step button{width:32px;height:30px;border:0;background:none;font-size:17px;line-height:1;color:var(--svag);border-radius:99px}
.step button:hover{background:var(--hover);color:var(--tekst)}
.step span{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.plus{flex:none;width:32px;height:32px;border-radius:99px;border:1px solid var(--linje);background:var(--flade);color:var(--svag);font-size:18px;line-height:1}
.plus:hover{border-color:var(--accent);color:var(--accent)}

.liste{background:var(--flade);border-left:1px solid var(--linje);display:flex;flex-direction:column;min-height:0}
.lhoved{padding:20px 22px 14px;border-bottom:1px solid var(--linje)}
.lhoved h2{margin:0;font-size:19px}
.felter{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:14px;align-items:end}
.lkrop{flex:1;overflow:auto;padding:6px 22px 22px}
.lg{margin-top:16px}
.ll{display:flex;gap:12px;align-items:flex-start;padding:5px 0 3px;border-top:1px solid var(--linje)}
.lg .ll:first-of-type{border-top:0}
.ll .n{flex:1;min-width:0;padding-top:5px}
.notefelt::placeholder{color:transparent}
.ll:hover .notefelt::placeholder,.notefelt:focus::placeholder{color:var(--svagere)}
.notefelt{display:block;width:100%;border:0;background:none;padding:0;margin-top:0;font-size:12px;line-height:16px;color:var(--svag);border-radius:4px}
.advl{font-size:12px;color:var(--adv);margin-top:2px}
.godk{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--flade2);font-size:13px}
.godk.ok{background:var(--ok-blid);color:var(--ok);font-weight:600}
.godk .fyld{flex:1}
.btn.godkend{border-color:var(--ok);color:var(--ok);background:none}
.btn.godkend:hover{background:var(--ok-blid)}
.genbrug{margin-top:12px;padding:12px;border-radius:10px;background:var(--flade2)}
.ekstra{margin-top:22px;padding:12px;border-radius:10px;background:var(--flade2);border:1px dashed var(--linje)}
.lfod{border-top:1px solid var(--linje);padding:14px 22px 18px}
.resume{margin:10px 0}
.svar{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;background:var(--flade2)}
.svar.ok{background:var(--ok-blid)}.svar.adv{background:var(--adv-blid)}.svar.fejl{background:var(--fejl-blid)}
.svar ul{margin:4px 0 0;padding-left:18px}
.svar a.btn{display:inline-block;margin-top:8px;text-decoration:none}

/* lager-fanen */
.lagerside{max-width:1100px;margin:0 auto;padding:24px 24px 130px}
.lagertop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lagertop h1{font-size:22px;margin:0}
.lagertop .input{width:240px}
.lhd,.lr{display:grid;grid-template-columns:minmax(180px,2.2fr) 150px 112px 112px minmax(140px,2fr) 32px;gap:8px;align-items:center;padding:6px 12px}
.lhd{font-size:11.5px;color:var(--svagere);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:20px}
.lr{border-top:1px solid var(--linje)}
.kort .lr:first-child{border-top:0}
.lr.aendret{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-blid)}
.lr.udgaaet{opacity:.55}
.felt{width:100%;border:1px solid transparent;background:none;border-radius:7px;padding:5px 7px}
.felt:hover{background:var(--hover)}
select.felt{appearance:none;-webkit-appearance:none;cursor:pointer}
.x{border:0;background:none;color:var(--svagere);font-size:18px;border-radius:6px;width:28px;height:28px}
.x:hover{background:var(--hover);color:var(--tekst)}
.nyform{margin-top:16px;padding:14px;border:1px solid var(--linje);border-radius:12px;background:var(--flade);display:grid;grid-template-columns:2fr 160px 120px 2fr auto;gap:10px;align-items:end}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--flade);border-top:1px solid var(--linje);padding:12px 24px}
.bar .indre{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .svar{margin:0;flex:1}

.beskeder{position:fixed;right:20px;top:68px;z-index:20;display:flex;flex-direction:column;gap:8px;width:340px;max-width:calc(100vw - 40px)}
.besked{background:var(--flade);border:1px solid var(--linje);border-radius:12px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.18);font-size:13px}
.besked.ok{border-color:var(--ok)}.besked.adv{border-color:var(--adv)}.besked.fejl{border-color:var(--fejl)}
.besked .bt{display:flex;align-items:center;gap:8px}.besked .bt b{flex:1;font-weight:600}
.besked ul{margin:4px 0 0;padding-left:18px;color:var(--svag)}
.spin{flex:none;width:12px;height:12px;border:2px solid var(--linje);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.opsaet{max-width:520px;margin:60px auto;background:var(--flade);border:1px solid var(--linje);border-radius:14px;padding:24px}
.opsaet h2{margin-top:0}
.fejltekst{color:var(--fejl)}
@media (max-width:900px){.ed{grid-template-columns:1fr;height:auto}.liste{border-left:0;border-top:1px solid var(--linje)}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div id="rod"></div>

<script>
"use strict";
const REPO = "djay-fabz/fabz-data", BRANCH = "main", API = "https://api.github.com";
const KAT = ["Lyd", "DJ-udstyr", "Lys", "Scene", "Stativer", "Kabler & strøm", "Transport", "Andet", "Løse genstande"];
const STATUS = ["På lager", "Defekt", "Udlånt", "Udgået"];
const EKSTRA = "Leje og andet";
const TOKEN_KEY = "fabz-panel-token";
const lager = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} }
};
let token = null;
let D = {kalender: null, udstyr: [], lister: [], opgaver: []};
let fane = "pakkelister";
let S = null;                      // åben pakkeliste (fuld skærm)
let P = {q: "", kat: "Alle"};      // søgning i lageret
let L = null;                      // lager-fanens ændringer
let optaget = false, henterJobs = false;

// ---------- hjælpere ----------
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const EGENSKAB = ["value", "checked", "disabled", "selected"];
function h(tag, props, ...born) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (EGENSKAB.includes(k)) e[k] = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of born.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const nøgle = s => String(s || "").trim().toLowerCase();
const iDag = () => new Intl.DateTimeFormat("sv-SE", {timeZone: "Europe/Copenhagen"}).format(new Date());
const DAGE = ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"];
const MD = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const MDL = ["januar", "februar", "marts", "april", "maj", "juni", "juli", "august", "september", "oktober", "november", "december"];
const dag = iso => new Date(iso.slice(0, 10) + "T12:00:00");
const langDato = iso => { const d = dag(iso); return `${DAGE[d.getDay()]} ${d.getDate()}. ${MDL[d.getMonth()]}`; };
const kategorier = () => { const k = [...KAT]; for (const u of D.udstyr) if (u.kategori && !k.includes(u.kategori)) k.push(u.kategori); return k; };
const lagerMap = () => new Map(D.udstyr.map(u => [nøgle(u.navn), u]));
function stepper(antal, f, titel) {
  return h("span", {class: "step"},
    h("button", {type: "button", title: "En mindre", "aria-label": `En mindre ${titel || ""}`, onclick: () => f(-1)}, "−"),
    h("span", {}, antal),
    h("button", {type: "button", title: "En mere", "aria-label": `En mere ${titel || ""}`, onclick: () => f(1)}, "+"));
}
function seg(valg, aktiv, f) {
  return h("div", {class: "seg"}, valg.map(v => {
    const [værdi, tekst] = Array.isArray(v) ? v : [v, v];
    return h("button", {type: "button", class: værdi === aktiv ? "aktiv" : "", onclick: () => f(værdi)}, tekst);
  }));
}

// ---------- GitHub ----------
const sti = p => p.split("/").map(encodeURIComponent).join("/");
function gh(path, {method = "GET", body, raw = false} = {}) {
  return fetch(API + path, {
    method, cache: "no-store",
    headers: {Authorization: "Bearer " + token, Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
              ...(body ? {"Content-Type": "application/json"} : {})},
    body: body ? JSON.stringify(body) : undefined
  });
}
function tjek(r, hvad) {
  if (r.ok) return r;
  if (r.status === 401) throw new Error("Tokenen blev afvist. Tjek at den ikke er udløbet, og skift den.");
  if (r.status === 403 || r.status === 404) throw new Error(`Ingen adgang til ${hvad}. Tjek at tokenen gælder ${REPO} med Contents og Actions (read/write).`);
  throw new Error(`${hvad}: GitHub svarede ${r.status}`);
}
async function laesFil(p) {
  const r = await gh(`/repos/${REPO}/contents/${sti(p)}?ref=${BRANCH}&t=${Date.now()}`, {raw: true});
  if (r.status === 404) return null;
  tjek(r, p);
  return r;
}
async function laesJson(p) {
  const r = await laesFil(p);
  if (!r) throw new Error(`Fandt ikke ${p}. Tjek at tokenen har adgang til ${REPO}.`);
  return r.json();
}
function base64(tekst) {
  let s = "";
  for (const x of new TextEncoder().encode(tekst)) s += String.fromCharCode(x);
  return btoa(s);
}
async function skrivFil(p, obj, besked) {
  tjek(await gh(`/repos/${REPO}/contents/${sti(p)}`, {method: "PUT",
    body: {message: besked, content: base64(JSON.stringify(obj, null, 1)), branch: BRANCH}}), "inbox");
}
async function hentData() {
  const [kalender, udstyr, lister, opgaver, jobpl] = await Promise.all([
    ...["data/kalender.json", "data/udstyr.json", "data/pakkelister.json", "data/opgaver.json"].map(laesJson), laesJobpl()]);
  D = {kalender, udstyr, lister, opgaver, jobpl};
}
async function laesJobpl() {   // findes først, når den første liste er godkendt
  const r = await laesFil("data/jobpakkelister.json");
  return r ? r.json() : [];
}
function nytId(præfiks) {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${præfiks}-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${Math.random().toString(36).slice(2, 6)}`;
}
// lægger en anmodning i inbox/ og venter på svaret fra fabz.py inbox
async function anmod(præfiks, krav, besked) {
  const id = nytId(præfiks);
  await skrivFil(`inbox/${id}.json`, krav, besked);
  const start = Date.now();
  while (Date.now() - start < 240000) {
    await sleep(1500);
    const r = await laesFil(`inbox/svar/${id}.json`);
    if (r) return r.json();
  }
  return null;
}

// ---------- baggrund og beskeder ----------
// Siden opdateres med det samme. Anmodningen afleveres til GitHub (1-2 sek), og svaret følges i baggrunden.
// Fejler den, kaldes fejl() som sætter siden tilbage, og der vises en besked.
let sender = 0;          // anmodninger der ikke er afleveret endnu (så må fanen ikke lukkes)
const beskeder = [];
function tegnBeskeder() {
  let el = $("beskeder");
  if (!el) { el = h("div", {id: "beskeder", class: "beskeder"}); document.body.append(el); }
  el.replaceChildren(...beskeder.map(b => h("div", {class: "besked " + b.klasse},
    h("div", {class: "bt"}, b.klasse === "kø" ? h("span", {class: "spin"}) : null, h("b", {}, b.titel),
      h("button", {class: "x", type: "button", title: "Luk", onclick: () => fjernBesked(b)}, "×")),
    b.punkter?.length ? h("ul", {}, b.punkter.map(p => h("li", {}, p))) : null)));
}
function besked(b) {
  const i = beskeder.findIndex(x => x.id === b.id);
  if (i >= 0) beskeder[i] = b; else beskeder.push(b);
  tegnBeskeder();
  if (b.klasse === "ok") setTimeout(() => fjernBesked(b), 6000);
}
function fjernBesked(b) {
  const i = beskeder.indexOf(b);
  if (i >= 0) { beskeder.splice(i, 1); tegnBeskeder(); }
}
async function iBaggrunden(præfiks, krav, commit, {tekst, ok, fejl}) {
  const id = nytId(præfiks);
  sender++;
  try { await skrivFil(`inbox/${id}.json`, krav, commit); } finally { sender--; }
  besked({id, klasse: "kø", titel: tekst + " …"});
  (async () => {
    let sv = null;
    try {
      const start = Date.now();
      while (!sv && Date.now() - start < 240000) {
        await sleep(1500);
        const r = await laesFil(`inbox/svar/${id}.json`);
        if (r) sv = await r.json();
      }
    } catch (e) { sv = {status: "FEJL", fejl: e.message}; }
    if (!sv) sv = {status: "FEJL", fejl: "Intet svar efter 4 minutter. Tjek Actions i fabz-data."};
    if (sv.status === "FEJL") {
      try { await fejl(sv); } catch {}
      besked({id, klasse: "fejl", titel: tekst + ": ikke gemt", punkter: [sv.fejl, "Siden er sat tilbage."]});
    } else {
      try { await ok(sv); } catch {}
      besked({id, klasse: sv.status === "ADVARSEL" ? "adv" : "ok", titel: tekst + (sv.status === "ADVARSEL" ? ": gemt, tjek advarslerne" : ": gemt"),
        punkter: [...sv.advarsler.map(a => "Advarsel: " + a), ...sv.info]});
    }
  })();
}
function sendFejl(tekst, e) {
  besked({id: nytId("x"), klasse: "fejl", titel: tekst + ": ikke sendt", punkter: [e.message, "Siden er sat tilbage."]});
}
// tegn det der vises, uden at forstyrre en åben editor eller ugemte lagerændringer
function opfrisk() {
  if (fane === "lager") { if (L && !ændringer().length && !L.ny.length) { const q = L.q, u = L.udgaaede; nulstilLager(); L.q = q; L.udgaaede = u; visLager(); } }
  else if (!S) visJobs();
  else tegnListe();
}

// ---------- jobs ----------
function jobs() {
  const idag = iDag();
  return (D.kalender?.begivenheder || []).filter(e => e.kalender === "bookinger").map(e => {
    const m = /^\s*DJ\s*:\s*(.+)/i.exec(e.titel || "");
    return m ? {navn: m[1].trim(), dato: e.start.slice(0, 10), sted: e.sted || "", besk: e.beskrivelse || ""} : null;
  }).filter(j => j && j.dato >= idag).sort((a, b) => a.dato.localeCompare(b.dato) || a.navn.localeCompare(b.navn));
}
// samme regel som fabz.py pakke-opgaver: listen med jobbets navn, eller "Pakkeliste: <liste>" i beskrivelsen
function listeTilJob(j) {
  const mb = /pakkeliste\s*:\s*([^\n\r<]+)/i.exec(j.besk);
  const ønsket = nøgle(mb ? mb[1] : j.navn);
  return D.lister.find(p => nøgle(p.navn) === ønsket) || null;
}
const jobNøgle = j => `${j.dato}|${j.navn.toLowerCase()}`;
const opgaveTilJob = j => D.opgaver.find(o => o.job_noegle === jobNøgle(j)) || null;
const jobplTilJob = j => (D.jobpl || []).find(r => r.job_noegle === jobNøgle(j)) || null;

    if (P.kat !== "Alle" && P.kat !== kat) continue;
    const us = D.udstyr.filter(u => u.kategori === kat && (u.status !== "Udgået" || S.l[nøgle(u.navn)]) && (!q || nøgle(u.navn).includes(q)))
      .sort((a, b) => a.navn.localeCompare(b.navn, "da"));

  if (u && l.antal > u.antal) t.push(`Lageret har kun ${u.antal}`);
  if (u && u.status !== "På lager") t.push(`Status er ${u.status}`);
  if (!u && !/^LEJE:/i.test(l.udstyr)) t.push("Findes ikke i lageret");
  return t;
}

        h("div", {class: "muted lille"}, S.job ? [langDato(S.job.dato), S.job.sted].filter(Boolean).join(" · ") : `Gemt liste (${S.base.type || "liste"})`)),
      o && o.status !== "Færdig" ? h("button", {class: "btn lille", type: "button", onclick: () => lukOpgave(o)}, "Luk opgave") : null),
    h("div", {class: "felter"},
      h("label", {}, h("span", {class: "etiket"}, "Navn på PDF"),
        h("input", {class: "input", value: S.jobNavn, oninput: e => { S.jobNavn = e.target.value; }})),
      h("div", {}, h("span", {class: "etiket"}, "Transport"), seg(["Trailer", "Kun bil"], S.transport, v => { S.transport = v; S.rørt = true; tegnListe(); }))),
    S.egen ? null : h("label", {style: "display:block;margin-top:12px"}, h("span", {class: "etiket"}, "Start fra"), startFra),

            adv.length ? h("div", {class: "advl"}, adv.join(". ")) : null),

    h("div", {style: "display:flex;gap:8px"}, ny, h("button", {class: "btn", type: "button", onclick: tilføj}, "Tilføj"))));

  const kan = !optaget && linjer.length && S.transport;
  const gemNavn = (S.gemNavn || "").trim();

          S.job ? h("button", {class: "x", type: "button", title: "Luk", onclick: () => { S.visGem = false; tegnListe(); }}, "×") : null),
        h("div", {style: "display:flex;gap:8px;margin-top:6px"},
          h("input", {class: "input", placeholder: "Navn på listen", value: S.gemNavn, oninput: e => {
            S.gemNavn = e.target.value;
            const f = D.lister.find(p => nøgle(p.navn) === nøgle(e.target.value));

          }}),
          (gemKnap = h("button", {class: "btn", type: "button", style: "flex:none", disabled: !kan, onclick: () => send("gem")},
            findes ? `Opdater '${findes.navn}'` : "Gem ny liste"))),
        (gemHjælp = h("div", {class: "lille muted", style: "margin-top:4px"}, findes ? "Erstatter den gemte liste med denne." : "Bliver en ny liste.")))
    : h("button", {class: "btn ghost lille", type: "button", style: "margin-top:8px;padding-left:0",
        onclick: () => { S.visGem = true; tegnListe(); }}, "Gem som liste til andre jobs …");
  const fod = h("div", {class: "lfod"},
    h("div", {class: "resume lille", style: advN ? "color:var(--adv)" : "color:var(--svag)"},
      `${linjer.length} linjer · ${stk} stk` + (advN ? ` · ${advN} advarsler` : "") + (S.transport ? "" : " · vælg transport")),
    h("button", {class: "btn primaer stor", type: "button", disabled: !kan, onclick: () => send("pdf")},
      optaget ? "Arbejder …" : "Lav pakkeliste (PDF)"),
    gemBlok,
    h("div", {id: "svar"}));
  k.replaceChildren(hoved, krop, fod);
  krop.scrollTop = gl;

}
let gemKnap = null, gemHjælp = null;
function godkendBlok(linjer) {
  const ændret = S.godk && signatur(Object.values(S.l)) !== S.snap;
  const kan = !optaget && linjer.length && S.transport;

      onclick: () => godkend(true)}, ændret ? "✓ Godkend igen" : "✓ Godkend pakkeliste"));

async function godkend(ja) {
  if (!ja && !confirm("Genåbn listen? Den bliver liggende, men jobbet står som ikke godkendt (gul), indtil du godkender igen.")) return;
  const job = S.job, mig = S, noegle = jobNøgle(job);
  const linjer = Object.values(S.l).filter(l => l.antal > 0)
    .map(l => ({udstyr: l.udstyr, antal: l.antal, ...(l.note?.trim() ? {note: l.note.trim()} : {})}));
  const krav = ja ? {type: "godkend", job: job.navn, dato: job.dato, transport: S.transport, linjer, udgangspunkt: S.base?.navn || null, godkendt: true}
                  : {type: "godkend", job: job.navn, dato: job.dato, godkendt: false};
  const før = (D.jobpl || []).map(r => ({...r})), førS = {godk: S.godk, snap: S.snap, rørt: S.rørt};
  // med det samme
  const r = D.jobpl.find(x => x.job_noegle === noegle);
  if (ja) {
    const ny = {job_noegle: noegle, job: job.navn, dato: job.dato, transport: S.transport, linjer, godkendt: iDag()};
    if (r) Object.assign(r, ny); else D.jobpl.push(ny);
  } else if (r) r.godkendt = null;
  S.godk = ja ? iDag() : null;
  if (ja) S.snap = signatur(linjer);
  S.rørt = false;
  S.svar = null;
  tegnListe();
  const tekst = `${ja ? "Godkendelse" : "Genåbning"}: ${job.navn} ${kortDato(job.dato)}`;
  const tilbage = () => { D.jobpl = før; if (S === mig) Object.assign(S, førS); opfrisk(); };
  try {
    await iBaggrunden("godkend", krav, `Panel: ${ja ? "godkend" : "genåbn"} ${job.navn}`, {tekst,
      ok: async () => {
        [D.jobpl, D.opgaver] = await Promise.all([laesJobpl(), laesJson("data/opgaver.json")]);
        if (S === mig) S.godk = jobplTilJob(job)?.godkendt || null;
        opfrisk();
      },
      fejl: tilbage});
  } catch (e) { tilbage(); sendFejl(tekst, e); }
}
function sætSvar(klasse, titel, punkter, link, filnavn) {

  tegnSvar();
}
function tegnSvar() {
  const el = $("svar");
  if (!el || !S) return;
  const s = S.svar;
  el.replaceChildren(s ? h("div", {class: "svar " + s.klasse}, h("b", {}, s.titel),

    s.link ? h("div", {style: "display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"},
      h("a", {class: "btn primaer", href: s.link, target: "_blank", rel: "noopener", style: "margin:0"}, "Åbn PDF og print"),
      h("a", {class: "btn", href: s.link, download: s.filnavn || "Pakkeliste.pdf", style: "margin:0"}, "Hent PDF")) : null) : "");
}
async function send(hvad) {   // "pdf": lav PDF (gemmer intet), "gem": gem som liste til andre jobs
  if (hvad === "gem") return gemSomListe();
  const navn = (S.jobNavn || "").trim();
  if (!navn) { alert("Skriv et navn til PDF'en."); return; }
  const linjer = Object.values(S.l).filter(l => l.antal > 0)
    .map(l => ({udstyr: l.udstyr, antal: l.antal, ...(l.note?.trim() ? {note: l.note.trim()} : {})}));
  const krav = {type: "pakkeliste", job: navn, dato: S.job?.dato || null, transport: S.transport, linjer, pdf: true,
    udgangspunkt: S.base?.navn || null, gem: "kun_job"};
  const mig = S;
  optaget = true;
  tegnListe();
  try {
    sætSvar("", "Laver pakkelisten … det tager typisk 15-30 sekunder.");
    const sv = await anmod("pakkeliste", krav, `Panel: pakkeliste ${navn}`);
    if (S !== mig) return;
    if (!sv) sætSvar("fejl", "Intet svar efter 4 minutter.", ["Tjek kørslen under Actions i fabz-data. Anmodningen ligger stadig i inbox/."]);
    else if (sv.status === "FEJL") sætSvar("fejl", "Fejl, ingen PDF.", [sv.fejl]);
    else {
      const punkter = [...sv.advarsler.map(a => "Advarsel: " + a), ...sv.info];
      const titel = sv.status === "ADVARSEL" ? "Lavet, men tjek advarslerne" : "Pakkelisten er klar";
      sætSvar(sv.status === "ADVARSEL" ? "adv" : "ok", titel, [...punkter, "Henter PDF …"]);
      const r = await laesFil(sv.pdf);
      const link = r ? URL.createObjectURL(new Blob([await r.arrayBuffer()], {type: "application/pdf"})) : null;
      if (S === mig) sætSvar(sv.status === "ADVARSEL" ? "adv" : "ok", titel, r ? punkter : [...punkter, "PDF'en kunne ikke hentes."], link, decodeURIComponent(sv.pdf.split("/").pop()));
    }
  } catch (e) {
    if (S === mig) sætSvar("fejl", "Det gik galt.", [e.message]);
  } finally {
    optaget = false;
    if (S === mig) tegnListe();
  }
}
async function gemSomListe() {
  const gemNavn = (S.gemNavn || "").trim();
  if (!gemNavn) { alert("Skriv et navn til listen."); return; }
  const findes = D.lister.find(p => nøgle(p.navn) === nøgle(gemNavn));
  const linjer = Object.values(S.l).filter(l => l.antal > 0)
    .map(l => ({udstyr: l.udstyr, antal: l.antal, ...(l.note?.trim() ? {note: l.note.trim()} : {})}));
  const krav = {type: "pakkeliste", job: (S.jobNavn || gemNavn).trim(), dato: S.job?.dato || null, transport: S.transport, linjer, pdf: false,
    udgangspunkt: S.base?.navn || null,
    ...(findes ? {gem: "opdater", liste: findes.navn} : {gem: "ny", ny_navn: gemNavn, ny_type: "Skabelon"})};
  const mig = S, før = D.lister.map(p => ({...p})), førS = {base: S.base, egen: S.egen, rørt: S.rørt};
  // med det samme
  let liste;
  if (findes) { liste = {...findes, linjer, transport: S.transport}; D.lister = D.lister.map(p => p === findes ? liste : p); }
  else { liste = {navn: gemNavn, type: "Skabelon", transport: S.transport, linjer}; D.lister = [...D.lister, liste]; }
  S.base = liste; S.egen = true;
  if (!S.job) S.rørt = false;
  tegnListe();
  const tekst = `${findes ? "Opdatering af" : "Ny liste"} '${liste.navn}'`;
  const tilbage = () => { D.lister = før; if (S === mig) Object.assign(S, førS); opfrisk(); };
  try {
    await iBaggrunden("pakkeliste", krav, `Panel: gem liste ${liste.navn}`, {tekst,
      ok: async () => {
        D.lister = await laesJson("data/pakkelister.json");
        if (S === mig) S.base = D.lister.find(p => nøgle(p.navn) === nøgle(gemNavn)) || S.base;
        opfrisk();
      },
      fejl: tilbage});
  } catch (e) { tilbage(); sendFejl(tekst, e); }
}
async function lukOpgave(o) {
  if (!confirm(`Er listen printet og pakket? Opgave #${o.id} sættes til Færdig.`)) return;
  const før = D.opgaver;
  D.opgaver = D.opgaver.map(x => x.id === o.id ? {...x, status: "Færdig"} : x);
  opfrisk();
  const tekst = `Opgave #${o.id}`;
  const tilbage = () => { D.opgaver = før; opfrisk(); };
  try {
    await iBaggrunden("luk", {type: "luk-opgave", opgave_id: o.id}, `Panel: luk opgave #${o.id}`, {tekst,
      ok: async () => { D.opgaver = await laesJson("data/opgaver.json"); opfrisk(); }, fejl: tilbage});
  } catch (e) { tilbage(); sendFejl(tekst, e); }
}

// ---------- lager-fanen ----------
const FELTER = ["navn", "kategori", "antal", "status", "note"];
function nulstilLager() {
  L = {w: D.udstyr.map(u => ({...u, status: u.status || "På lager", note: u.note || "", _orig: u.navn})), ny: [], q: "", udgaaede: false, visNy: false, svar: null};
}
function ændringer() {
  const ud = [];
  for (const w of L.w) {
    const o = D.udstyr.find(u => u.navn === w._orig);
    if (!o) continue;
    const f = {};
    for (const k of FELTER) {
      const a = o[k] ?? (k === "status" ? "På lager" : ""), b = k === "navn" ? w.navn.trim() : w[k];
      if (String(a) !== String(b ?? "")) f[k] = b;
    }
    if (Object.keys(f).length) ud.push({navn: w._orig, felter: f});
  }
  return ud;
}
const erÆndret = w => { const o = D.udstyr.find(u => u.navn === w._orig); return !!o && FELTER.some(k => String(o[k] ?? (k === "status" ? "På lager" : "")) !== String(k === "navn" ? w.navn.trim() : (w[k] ?? ""))); };
function vælg(valg, v, f) {
  return h("select", {class: "felt", onchange: e => f(e.target.value)}, valg.map(x => h("option", {value: x, selected: x === v}, x)));
}
function visLager() {
  if (!L) nulstilLager();
  const y = window.scrollY;
  const søg = h("input", {class: "input", type: "search", placeholder: "Søg …", value: L.q, oninput: () => { L.q = søg.value; filtrér(); }});
  const aktive = D.udstyr.filter(u => u.status !== "Udgået").length;
  const side = h("div", {class: "lagerside"},
    h("div", {class: "lagertop"},
      h("h1", {}, "Lager"), h("span", {class: "muted"}, `${aktive} ting`),
      h("div", {class: "spacer"}), søg,
      h("label", {class: "muted lille"}, h("input", {type: "checkbox", checked: L.udgaaede, onchange: e => { L.udgaaede = e.target.checked; visLager(); }}), " Vis udgået"),
      h("button", {class: "btn primaer", type: "button", onclick: () => { L.visNy = true; visLager(); $("nyNavn")?.focus(); }}, "+ Nyt udstyr")),
    L.visNy ? nyForm() : null,
    h("div", {class: "lhd"}, h("span", {}, "Navn"), h("span", {}, "Kategori"), h("span", {}, "Antal"), h("span", {}, "Status"), h("span", {}, "Fast note"), h("span", {})),
    L.ny.length ? h("div", {class: "gruppe", "data-gruppe": ""}, h("div", {class: "overskrift"}, "Nyt, gemmes når du trykker Gem"),
      h("div", {class: "kort"}, L.ny.map((n, i) => h("div", {class: "lr aendret", "data-navn": nøgle(n.navn)},
        h("span", {style: "padding:0 7px;font-weight:600"}, n.navn), h("span", {}, n.kategori), h("span", {}, n.antal + " stk"), h("span", {}, "På lager"),
        h("span", {class: "muted"}, n.note || ""),
        h("button", {class: "x", type: "button", title: "Fjern", onclick: () => { L.ny.splice(i, 1); visLager(); }}, "×"))))) : null,
    kategorier().map(kat => {
      const ws = L.w.filter(w => w.kategori === kat && (L.udgaaede || w.status !== "Udgået" || erÆndret(w))).sort((a, b) => a._orig.localeCompare(b._orig, "da"));
      return ws.length ? h("div", {class: "gruppe", "data-gruppe": ""}, h("div", {class: "overskrift"}, kat), h("div", {class: "kort"}, ws.map(lagerRække))) : null;
    }),
    h("div", {class: "bar", id: "bar"}));
  $("rod").replaceChildren(side);
  filtrér();
  tegnBar();
  window.scrollTo(0, y);
}
function lagerRække(w) {
  const r = h("div", {class: "lr" + (w.status === "Udgået" ? " udgaaet" : ""), "data-navn": nøgle(w.navn)});
  const markér = () => { r.classList.toggle("aendret", erÆndret(w)); r.dataset.navn = nøgle(w.navn); L.svar = null; tegnBar(); };
  const antalEl = h("span", {}, w.antal);
  const skift = d => { w.antal = Math.max(0, (Number(w.antal) || 0) + d); antalEl.textContent = w.antal; markér(); };
  r.append(
    h("input", {class: "felt", value: w.navn, "aria-label": "Navn", style: "font-weight:500", oninput: e => { w.navn = e.target.value; markér(); }}),
    vælg(kategorier(), w.kategori, v => { w.kategori = v; L.svar = null; visLager(); }),
    h("span", {class: "step"}, h("button", {type: "button", "aria-label": "En mindre", onclick: () => skift(-1)}, "−"), antalEl,
      h("button", {type: "button", "aria-label": "En mere", onclick: () => skift(1)}, "+")),
    vælg(STATUS, w.status, v => { w.status = v; L.svar = null; visLager(); }),
    h("input", {class: "felt", value: w.note || "", placeholder: "–", "aria-label": "Note", oninput: e => { w.note = e.target.value; markér(); }}),
    h("span", {}));
  r.classList.toggle("aendret", erÆndret(w));
  return r;
}
function filtrér() {
  const q = nøgle(L.q);
  for (const g of document.querySelectorAll("[data-gruppe]")) {
    let n = 0;
    for (const r of g.querySelectorAll(".lr")) { const vis = !q || r.dataset.navn.includes(q); r.style.display = vis ? "" : "none"; if (vis) n++; }
    g.style.display = n ? "" : "none";
  }
}
function nyForm() {
  const navn = h("input", {class: "input", id: "nyNavn", placeholder: "Fx Røgmaskine"});
  const kat = vælg(KAT, KAT[0], () => {});
  kat.className = "input";
  const antal = h("input", {class: "input", type: "number", min: "0", step: "1", value: "1"});
  const note = h("input", {class: "input", placeholder: "Fast note (valgfri)"});
  const tilføj = () => {
    const n = navn.value.trim(), a = Number(antal.value);
    if (!n) { navn.focus(); return; }
    if ([...L.w.map(w => w.navn), ...L.ny.map(x => x.navn)].some(x => nøgle(x) === nøgle(n))) { alert(`'${n}' findes allerede på lageret.`); return; }
    if (!Number.isInteger(a) || a < 0) { alert("Antal skal være et helt tal fra 0 og op."); return; }
    L.ny.push({navn: n, kategori: kat.value, antal: a, note: note.value.trim()});
    L.svar = null;
    visLager();
    $("nyNavn")?.focus();
  };
  navn.addEventListener("keydown", e => { if (e.key === "Enter") tilføj(); });
  return h("div", {class: "nyform"},
    h("label", {}, h("span", {class: "etiket"}, "Navn"), navn),
    h("label", {}, h("span", {class: "etiket"}, "Kategori"), kat),
    h("label", {}, h("span", {class: "etiket"}, "Antal"), antal),
    h("label", {}, h("span", {class: "etiket"}, "Note"), note),
    h("div", {style: "display:flex;gap:6px"}, h("button", {class: "btn primaer", type: "button", onclick: tilføj}, "Tilføj"),
      h("button", {class: "btn ghost", type: "button", onclick: () => { L.visNy = false; visLager(); }}, "Luk")));
}
function tegnBar() {
  const bar = $("bar");
  if (!bar) return;
  const n = ændringer().length + L.ny.length;
  bar.style.display = n ? "" : "none";
  bar.replaceChildren(h("div", {class: "indre"},
    h("div", {style: "flex:1"}, h("b", {}, `${n} ${n === 1 ? "ændring" : "ændringer"}`), h("span", {class: "muted"}, " er ikke gemt endnu")),
    h("button", {class: "btn ghost", type: "button", onclick: () => { nulstilLager(); visLager(); }}, "Fortryd"),
    h("button", {class: "btn primaer", type: "button", onclick: gemLager}, "Gem på lageret")));
}
function anvendLager(us, ret, ny) {   // samme regler som fabz.py lager_ret/lager_ny, kun til visning indtil svaret kommer
  const ud = us.map(u => ({...u}));
  for (const r of ret) {
    const u = ud.find(x => nøgle(x.navn) === nøgle(r.navn));
    if (!u) continue;
    for (const [k, v] of Object.entries(r.felter)) {
      if (k === "note") { if (String(v || "").trim()) u.note = String(v).trim(); else delete u.note; }
      else if (k === "antal") u.antal = Number(v);
      else u[k] = k === "navn" ? String(v).trim() : v;
    }
    if (u.antal === 0 && (u.status || "På lager") === "På lager") u.status = "Udgået";
  }
  for (const n of ny) ud.push({navn: n.navn, kategori: n.kategori, antal: n.antal, status: "På lager", ...(n.note ? {note: n.note} : {})});
  return ud;
}
async function gemLager() {
  const ret = ændringer();
  if (ret.some(r => r.felter.navn !== undefined && !String(r.felter.navn).trim())) { alert("Et navn er tomt."); return; }
  const ny = L.ny.map(x => ({navn: x.navn, kategori: x.kategori, antal: x.antal, note: x.note}));
  const førU = D.udstyr, førLister = D.lister, førL = L;
  // med det samme
  const omdøbt = new Map(ret.filter(r => r.felter.navn !== undefined).map(r => [nøgle(r.navn), String(r.felter.navn).trim()]));
  D.udstyr = anvendLager(D.udstyr, ret, ny);
  D.lister = D.lister.map(p => ({...p, linjer: p.linjer.map(l => omdøbt.has(nøgle(l.udstyr)) ? {...l, udstyr: omdøbt.get(nøgle(l.udstyr))} : l)}));
  nulstilLager(); L.q = førL.q; L.udgaaede = førL.udgaaede;
  visLager();
  const tekst = `Lager (${ret.length} rettet, ${ny.length} nye)`;
  const tilbage = () => {
    D.udstyr = førU; D.lister = førLister;
    L = førL;   // dine ændringer kommer tilbage i tabellen, så du kan rette og gemme igen
    if (fane === "lager") visLager();
  };
  try {
    await iBaggrunden("lager", {type: "lager", ret, ny}, `Panel: lager (${ret.length} rettet, ${ny.length} nye)`, {tekst,
      ok: async () => { [D.udstyr, D.lister] = await Promise.all([laesJson("data/udstyr.json"), laesJson("data/pakkelister.json")]); opfrisk(); },
      fejl: tilbage});
  } catch (e) { tilbage(); sendFejl(tekst, e); }
}

// ---------- hent alle jobs ----------
async function hentJobs() {
  henterJobs = true;
  tegnTop();
  const t0 = Date.now();
  try {
    tjek(await gh(`/repos/${REPO}/actions/workflows/kalender.yml/dispatches`, {method: "POST", body: {ref: BRANCH, inputs: {opgaver: "true"}}}), "kalender-workflowet");
    let run = null;
    while (Date.now() - t0 < 240000) {
      await sleep(4000);
      const rr = tjek(await gh(`/repos/${REPO}/actions/workflows/kalender.yml/runs?event=workflow_dispatch&per_page=5&t=${Date.now()}`), "kørselsstatus");
      run = (await rr.json()).workflow_runs.find(x => Date.parse(x.created_at) >= t0 - 60000);
      if (run && run.status === "completed") break;
      run = null;
    }
    if (!run) throw new Error("Hentningen blev ikke færdig inden 4 minutter. Tjek Actions i fabz-data.");
    if (run.conclusion !== "success") throw new Error("Hentningen fejlede (" + run.conclusion + "). Se " + run.html_url);
    await hentData();
  } catch (e) {
    alert(e.message);
  } finally {
    henterJobs = false;
    tegn();
  }
}

// ---------- token og start ----------
function skiftToken() {
  lager.del(TOKEN_KEY);
  token = null;
  visOpsaet();
}
function visOpsaet(fejl) {
  $("top").replaceChildren(h("span", {class: "brand"}, "Fabz"));
  const felt = h("input", {class: "input", type: "password", placeholder: "github_pat_…", autocomplete: "off"});
  const gem = () => { const t = felt.value.trim(); if (!t) return; lager.set(TOKEN_KEY, t); token = t; start(); };
  felt.addEventListener("keydown", e => { if (e.key === "Enter") gem(); });
  $("rod").replaceChildren(h("div", {class: "opsaet"},
    h("h2", {}, "Indsæt din token"),
    h("p", {class: "muted"}, "Den ligger i 1Password (fine-grained, kun til ", REPO, ", Contents og Actions read/write). Den gemmes kun i denne browser."),
    fejl ? h("p", {class: "fejltekst"}, fejl) : null, felt,
    h("div", {style: "margin-top:12px"}, h("button", {class: "btn primaer", type: "button", onclick: gem}, "Gem og åbn"))));
}
async function start() {
  token = token || lager.get(TOKEN_KEY);
  if (!token) { visOpsaet(); return; }
  $("rod").replaceChildren(h("div", {class: "tom"}, "Henter data …"));
  try { await hentData(); } catch (e) { visOpsaet(e.message); return; }
  S = null; L = null;
  tegn();
}
window.addEventListener("beforeunload", e => {
  if (sender > 0 || (L && (ændringer().length || L.ny.length))) { e.preventDefault(); e.returnValue = ""; }
});
start();
</script>
