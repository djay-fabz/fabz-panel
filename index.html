*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tekst);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input::placeholder{color:var(--svagere)}

/* top */
.top{position:sticky;top:0;z-index:10;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--flade);border-bottom:1px solid var(--linje)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;margin-right:6px}
.brand::before{content:"";width:26px;height:26px;background:var(--logo) center/contain no-repeat}
.tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px}
.tab{border:0;background:none;padding:5px 14px;border-radius:7px;color:var(--svag);font-weight:500}
.tab.aktiv{background:var(--flade);color:var(--tekst);box-shadow:var(--skygge),0 0 0 1px var(--linje)}
.tab:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
.muted{color:var(--svag)}.lille{font-size:12.5px}
.tilbage{border:0;background:none;padding:6px 10px 6px 4px;border-radius:8px;color:var(--svag);font-weight:500}
.tilbage:hover{background:var(--hover);color:var(--tekst)}

/* menu: Mere */
.mere{position:relative;display:flex}
.meremenu{position:absolute;right:0;top:calc(100% + 8px);min-width:190px;background:var(--flade);border:1px solid var(--linje);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;z-index:30;display:flex;flex-direction:column}
.meremenu button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;font-weight:500}
.meremenu button:hover{background:var(--hover)}.meremenu button.aktiv{background:var(--bg)}
.meremenu hr{border:0;border-top:1px solid var(--linje);margin:4px 2px;width:auto}
@media (max-width:700px){
  .top{padding:0 14px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;border-radius:0;background:var(--flade);border-top:1px solid var(--linje);padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:0;justify-content:space-around}
  .tabs .tab,.tabs .mere{flex:1}.tabs .mere .tab{width:100%}
  .tab{padding:9px 2px;font-size:12.5px;text-align:center;white-space:nowrap}
  .meremenu{top:auto;bottom:calc(100% + 8px);right:8px}
  body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .bar{bottom:calc(56px + env(safe-area-inset-bottom))}
  .beskeder{bottom:calc(68px + env(safe-area-inset-bottom))}
  body.bar-synlig .beskeder{bottom:calc(140px + env(safe-area-inset-bottom))}
}

/* knapper og felter */
.btn{border:1px solid var(--linje);background:var(--flade);color:var(--tekst);padding:7px 13px;border-radius:8px;font-weight:500}
a.btn{display:inline-block;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.primaer{background:var(--accent);border-color:var(--accent);color:var(--accent-tekst)}
.btn.primaer:hover{filter:brightness(1.06);background:var(--accent)}
.btn.stor{width:100%;padding:11px 16px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{border-color:transparent;background:none;color:var(--svag)}
.btn.ghost:hover{background:var(--hover);color:var(--tekst)}
.input{width:100%;padding:8px 11px;border:1px solid var(--linje);border-radius:9px;background:var(--flade)}
.input:focus,.felt:focus,.notefelt:focus{outline:2px solid var(--accent);outline-offset:-1px}
.etiket{display:block;font-size:11.5px;color:var(--svag);margin-bottom:4px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;color:var(--svag);font-size:13px;font-weight:500}
.seg button.aktiv{background:var(--flade);color:var(--tekst);box-shadow:var(--skygge),0 0 0 1px var(--linje)}
.overskrift{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--svagere);margin:0 0 6px 2px}
.tom{color:var(--svag);text-align:center;padding:48px 12px}

/* jobs (startside) */
.side{max-width:1228px;margin:0 auto;padding:28px 24px 60px}
.side:not(.bred)>*{max-width:760px}
.side h1{font-size:22px;margin:0 0 4px}
.jobliste{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.job{display:flex;gap:16px;align-items:center;width:100%;text-align:left;border:1px solid var(--linje);background:var(--flade);padding:12px 16px;border-radius:12px}
.job:hover{border-color:var(--accent)}
.dato{flex:none;width:44px;text-align:center;line-height:1.1}
.dato b{display:block;font-size:20px}
.dato span{font-size:11px;color:var(--svag);text-transform:uppercase;letter-spacing:.04em}
.job .t{flex:1;min-width:0}
.job .t b{display:block;font-size:15px;font-weight:600}
.job .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12.5px;color:var(--svag);white-space:nowrap}
.prik{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--svagere);vertical-align:1px}
.prik.ok{background:var(--ok)}.prik.adv{background:var(--adv)}
.andre{margin-top:28px;display:flex;gap:10px;align-items:center}
.andre select{max-width:280px}

/* editor (fuld skærm) */
.jo-detalje{padding:4px 14px 16px 42px;border-top:1px solid var(--linje);background:var(--flade2)}
@media (max-width:700px){.jo-detalje{padding-left:14px}}
.fokus{display:grid;gap:14px;margin-top:20px}.resten summary{cursor:pointer;padding:6px 2px}
.bryd{display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:9px 12px;font-weight:600;margin-top:6px}
.bryd.adv{background:var(--adv-blid);color:var(--adv)}.bryd.fejl{background:var(--fejl-blid);color:var(--fejl)}
.dato-adv{margin-top:8px;border-radius:8px;padding:8px 11px;font-weight:600}.dato-adv.adv{background:var(--adv-blid);color:var(--adv)}.dato-adv.fejl{background:var(--fejl-blid);color:var(--fejl)}
.bryd .kun-tlf{display:none}
@media (max-width:700px){.bryd .navne{display:none}.bryd .kun-tlf{display:inline}}
.agr.markeret{outline:2px solid var(--adv);outline-offset:6px;border-radius:10px}
.vaelg.låst,.liste.låst .lkrop .step,.liste.låst .lkrop .ekstra,.liste.låst .lkrop .notefelt,.liste.låst .lhoved .felter,.liste.låst .lhoved .startfra,.liste.låst .anlaeg{pointer-events:none}
.vaelg.låst{opacity:.45}.liste.låst .lkrop .step,.liste.låst .lkrop .ekstra{opacity:.4}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,460px);height:calc(100vh - var(--top))}
.vaelg{overflow:auto;padding:0 28px 40px}
.soeg{position:sticky;top:0;z-index:2;background:var(--bg);padding:20px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--linje);background:var(--flade);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--svag)}
.chip:hover{color:var(--tekst)}
.anlaeg{margin-bottom:14px;padding:14px;border:1px solid var(--linje);border-radius:14px;background:var(--flade)}

const sti = p => p.split("/").map(encodeURIComponent).join("/");
function gh(path, {method = "GET", body, raw = false} = {}) {

    body: body ? JSON.stringify(body) : undefined

}
function tjek(r, hvad) {

  if (r.status === 401) throw new Error("Tokenen blev afvist. Tjek at den ikke er udløbet, og skift den.");
  if (r.status === 403 || r.status === 404) throw new Error(`Ingen adgang til ${hvad}. Tjek at tokenen gælder ${REPO} med Contents og Actions (read/write).`);
  throw new Error(`${hvad}: GitHub svarede ${r.status}`);
}
async function laesFil(p) {
  const r = await gh(`/repos/${REPO}/contents/${sti(p)}?ref=${BRANCH}&t=${Date.now()}`, {raw: true});
  if (r.status === 404) return null;
  tjek(r, p);
  return r;
}
async function laesJson(p) {

}

// Skrivninger sendes én ad gangen. Trykker man hurtigt flere gange, kan GitHub svare 409 (to commits på samme tid),

let skriveKø = Promise.resolve();
function skrivFil(p, obj, besked) {
  const job = skriveKø.then(async () => {
    const body = {message: besked, content: base64(JSON.stringify(obj, null, 1)), branch: BRANCH};
    for (let forsøg = 0; ; forsøg++) {
      const r = await gh(`/repos/${REPO}/contents/${sti(p)}`, {method: "PUT", body});
      if ((r.status === 409 || r.status === 422) && forsøg < 4) { await new Promise(ok => setTimeout(ok, 600 * (forsøg + 1))); continue; }
      tjek(r, "inbox");

}

async function iBaggrunden(præfiks, krav, commit, {tekst, ok, fejl}) {
  const id = nytId(præfiks);
  sender++;
  try { await skrivFil(`inbox/${id}.json`, krav, commit); } finally { sender--; }
  besked({id, klasse: "kø", titel: tekst + " …"});
  (async () => {
    let sv = null;
    try {
      const start = Date.now();
      let iKø = false;
      while (!sv && Date.now() - start < 900000) {   // efter 4 min: "I kø", og der ventes op til 15 min, før det kaldes en fejl (29/10)
        await sleep(Date.now() - start < 240000 ? 1500 : 5000);
        if (!iKø && Date.now() - start >= 240000) { iKø = true; besked({id, klasse: "kø", titel: tekst + ": I kø, gemmes om lidt"}); }
        const r = await laesFil(`inbox/svar/${id}.json`);

    if (!sv) sv = {status: "FEJL", fejl: "Intet svar efter 15 minutter. Tjek Actions i fabz-data."};
    if (sv.status === "FEJL") {

      if (håndteret === true) fjernBesked(beskeder.find(b => b.id === id));
      else besked({id, klasse: "fejl", titel: tekst + ": ikke gemt", punkter: [sv.fejl, "Siden er sat tilbage."]});

  })();
}

const TB_KEY = "fabz-tilbud-kladde";

const tbNy = () => ({type: "tilbud", kundetype: "erhverv", dato: iDag(), firma: "", navn: "", mail: "", tlf: "",

const tbKr = n => { const f = Math.floor(n), r = n - f === 0.5 ? (f % 2 ? f + 1 : f) : Math.round(n); return String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " kr."; };   // som Pythons round()
const tbDato = iso => { const d = dag(iso); return `${d.getDate()}. ${MDL[d.getMonth()]} ${d.getFullYear()}`; };
const tbMinus = (iso, n) => plusDage(iso, -n);
const tbEsc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
const tbTal = s => { const t = String(s ?? "").replace(/\s|kr\.?/gi, "").replace(/\./g, "").replace(",", "."); return t === "" ? 0 : Number(t); };

function tbBeregn(T) {   // samme regler som lav_tilbud.py. Giver {fejl} eller alle tal og tekster
  const erhverv = T.kundetype === "erhverv", ob = T.type === "ordrebekraeftelse";

  if (!(firma || T.navn).trim()) return {fejl: T.kundetype === "erhverv" ? "Skriv kundens firma eller navn." : "Skriv kundens navn."};
  const gyldig = ob ? null : plusDage(idag, 14);
  const linjer = [];
  for (const l of T.linjer) {
    if (!l.tekst.trim() && !String(l.beloeb).trim()) continue;
    const b = tbTal(l.beloeb);
    if (!l.tekst.trim() || !Number.isFinite(b)) return {fejl: "Hver prislinje skal have tekst og beløb."};
    linjer.push({tekst: l.tekst.trim(), beloeb: b});

  if (!Number.isFinite(km) || !Number.isFinite(bro)) return {fejl: "Kørsel og bro/færge skal være tal."};
  if (km) linjer.push({tekst: `Kørsel, ${km} km tur/retur à 4 kr.`, beloeb: km * 4});
  if (bro) linjer.push({tekst: "Bro/færge", beloeb: bro});
  if (!linjer.length) return {fejl: "Skriv mindst én prislinje."};
  const g = (String(T.gaester || "").match(/\d+/g) || []).map(Number);
  const mange = g.length && Math.max(...g) > 100;
  const s = linjer.reduce((a, l) => a + l.beloeb, 0);

      : "Aflysning skal ske skriftligt. Da der er under 30 dage til arrangementet, betales 100 % af honoraret ekskl. moms ved aflysning.";
  } else {
    const d30 = tbMinus(ev, 30);
    afl = idag < d30 ? `Aflysning skal ske skriftligt senest ${tbDato(d30)}. Senere aflysning: 100 % af honoraret.` : "Da der er under 30 dage til festen, betales 100 % af honoraret ved aflysning.";
  }
  const betaling = erhverv ? [
    `Der betales ikke depositum. Aftalen er bindende, og datoen er jeres, når I har bekræftet ${ob ? "denne ordrebekræftelse" : "ordrebekræftelsen"} skriftligt.`,
    "Det fulde beløb faktureres efter arrangementet med betaling netto 8 dage.", afl,

// ---- udfyld fra en forespørgsel eller et job (kun data panelet har i forvejen) ----
function tbStart(felter) {
  if (!TB) { try { TB = JSON.parse(lager.get(TB_KEY) || "null"); } catch { TB = null; } }
  if (TB && (TB.firma || TB.navn || "").trim() && !confirm("Erstat det tilbud, der allerede er i gang i Tilbud-fanen?")) return;
  TB = {...tbNy(), ...felter};
  TB.indhold = TB_INDHOLD[TB.kundetype].join("\n");
  if (TB.pakke) tbVælgPakke(TB.pakke);
  tbGem(); fane = "tilbud"; JH = null; tegn(); window.scrollTo(0, 0);
}
const tbKontakt = t => ({mail: ((t || "").match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/) || [""])[0],
  tlf: ((t || "").replace(/[\w.+-]+@\S+/g, "").match(/(\+45)?[\d ]{8,}/) || [""])[0].trim()});
function tbTypeFelter(type, dato) {   // forespørgslens/jobbets type -> kundetype, anledning og pakke
  const t = (type || "").toLowerCase();
  if (/bryllup/.test(t)) return {kundetype: "privat", anledning: "Bryllup"};
  if (/privat|fødselsdag|fest$/.test(t)) return {kundetype: "privat", anledning: "Fest"};
  if (/erhverv|firma|julefrokost/.test(t)) { const jul = /julefrokost/.test(t) || (dato || "").slice(5, 7) === "12" || (dato || "").slice(5, 7) === "11";
    return {kundetype: "erhverv", anledning: jul ? "Julefrokost" : "Firmafest", pakke: "firmafest"}; }
  return {kundetype: "erhverv", anledning: ""};
}
function tbFraForesp(x) {
  const k = tbKontakt(x.kontakt), sted = ((x.note || "").match(/[^.\n]*\b\d{4} [A-ZÆØÅ][\wæøå]+/) || [""])[0].trim();
  return {navn: x.kunde || "", mail: k.mail, tlf: k.tlf, evdato: x.eventdato || "", gaester: x.gaester ? String(x.gaester) : "", sted,
    h_id: x.id, ...tbTypeFelter(x.type, x.eventdato)};   // h_id: "Markér som sendt" sætter forespørgslen til Tilbud sendt (29/10)
}
function tbFraJob(j) {
  const t = (j.besk || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "");
  const kunde = (t.split(/\n\s*KUNDE\s*\n/)[1] || t).split(/\n\s*[A-ZÆØÅ ]{3,}\s*\n/)[0];
  const f = n => ((kunde.match(new RegExp(`^\\s*${n}\\s*:[ \\t]*(.*)$`, "mi")) || [])[1] || "").trim();
  const kundeNavn = f("Kunde").replace(/\s*\(.*$/, ""), parentes = (f("Kunde").match(/\(([^)]*)\)/) || [])[1] || "";
  const tf = tbTypeFelter(f("Jobtype") || parentes, j.dato);
  const anl = parentes.split(",").map(x => x.trim()).find(x => x && !/^(privat|erhverv)$/i.test(x));
  const erhverv = tf.kundetype === "erhverv";
  return {...tf, ...(anl ? {anledning: anl[0].toUpperCase() + anl.slice(1)} : {}),
    firma: erhverv ? kundeNavn : "", navn: f("Kontaktperson") || (erhverv ? "" : kundeNavn), mail: f("Mail"), tlf: f("Telefon"),
    evdato: j.dato, sted: j.sted || "", tider: jobTider(j).filter(l => !/:\s*$|ikke aftalt|skal aftales/i.test(l)).join(", ")};
}

const tbPakke = id => (D.priser?.pakker || []).find(p => p.id === id);
function tbVælgPakke(id) {
  const p = tbPakke(id), før = TB.pakke;

  if (p && !før && TB.linjer.length) TB.linjer.shift();   // første pakke: den håndskrevne hovedlinje erstattes af pakken
  if (!p) { if (!TB.linjer.length) TB.linjer = [{tekst: "", beloeb: ""}]; return; }

  TB.indhold = p.indhold.join("\n");

  const tryk = `<script>Promise.all(['400 12px "Instrument Serif"', "400 12px Poppins", "500 12px Poppins"].map(f => document.fonts.load(f)))
  .then(() => document.fonts.ready).catch(() => {}).then(() => setTimeout(() => { document.body.dataset.klar = "1"; print(); }, 200));<\/script>`;   // scriptet venter selv på stylesheetet over det
  const url = URL.createObjectURL(new Blob([tbHtml(TB, R).replace("</body>", tryk + "</body>")], {type: "text/html;charset=utf-8"}));

}

// ---------- Kort: festkort og klubkort til et job, og klubkortenes tekster ----------
const KT = {job: null, slags: null, red: {}, ny: {tekst: "", svar: ""}};
function visKort() {
  const js = jobs();
  if (!KT.job || !js.some(j => jobNøgle(j) === KT.job)) { const f = js.find(erKlub) || js[0]; KT.job = f ? jobNøgle(f) : null; KT.slags = null; KT.fk = KT.kk = null; }

// ---------- hent alle jobs ----------
async function hentJobs() {
  henterJobs = true;
  tegn();
  const t0 = Date.now();
  try {
    tjek(await gh(`/repos/${REPO}/actions/workflows/kalender.yml/dispatches`, {method: "POST", body: {ref: BRANCH, inputs: {opgaver: "true"}}}), "kalender-workflowet");
    let run = null;
    while (Date.now() - t0 < 240000) {
      await sleep(4000);
      const rr = tjek(await gh(`/repos/${REPO}/actions/workflows/kalender.yml/runs?event=workflow_dispatch&per_page=5&t=${Date.now()}`), "kørselsstatus");
      run = (await rr.json()).workflow_runs.find(x => Date.parse(x.created_at) >= t0 - 60000);
      if (run && run.status === "completed") break;
      run = null;
    }
    if (!run) throw new Error("Hentningen blev ikke færdig inden 4 minutter. Tjek Actions i fabz-data.");
    if (run.conclusion !== "success") throw new Error("Hentningen fejlede (" + run.conclusion + "). Se " + run.html_url);
    await hentData();
  } catch (e) {
    alert(e.message);
  } finally {
    henterJobs = false;
    tegn();
  }
}
